<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raccolta Differenziata</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; width: 100%; max-width: 460px; text-align: center; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; color: #1a1a1a; }
    
    .day-badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 8px; }
    .target-day { font-size: 0.85rem; color: #666; font-weight: 600; margin-bottom: 16px; }
    
    .waste-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .waste-box { padding: 20px; border-radius: 12px; color: white; font-size: 1.4rem; font-weight: bold; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
    
    /* Colori Frazioni Rifiuti e Servizi */
    .umido { background-color: #8D6E63; }
    .carta { background-color: #1E88E5; }
    .plastica { background-color: #FDD835; color: #333; }
    .secco { background-color: #757575; }
    .vetro { background-color: #00897B; }
    .sfalci { background-color: #2E7D32; }
    .pulizia_strada { background-color: #E65100; }
    .nessuno { background-color: #B0BEC5; color: #555; }

    .day-row { border-bottom: 1px solid #eee; padding: 12px 0; text-align: left; }
    .day-title { font-weight: bold; margin-bottom: 4px; color: #2563eb; }
    .day-subtitle { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-group label { background: #f0f4f8; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; user-select: none; }
    .checkbox-group input { margin-right: 4px; }

    button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
    button:hover { background: #1d4ed8; }

    #result { margin-top: 20px; display: none; word-break: break-all; }
    .btn-secondary { background: #6b7280; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <!-- VISTA GIORNO (NFC) -->
  <div id="view-mode" style="display:none;">
    <div id="day-name" class="day-badge">Oggi: ---</div>
    <div id="target-day" class="target-day">Da esporre stasera per la raccolta di ---</div>
    <div id="waste-container" class="waste-container"></div>
    <button class="btn-secondary" onclick="showConfig()">Modifica Calendario</button>
  </div>

  <!-- VISTA CONFIGURAZIONE -->
  <div id="config-mode">
    <h1>Configura Calendario Raccolta</h1>
    <p style="font-size:0.85rem; color:#666; margin-bottom:15px;">Seleziona i rifiuti in base al <b>giorno di passaggio del camion</b> (la pagina calcolerà in automatico l'esposizione della sera prima).</p>
    <form id="schedule-form">
      <div id="days-config"></div>
      <button type="button" onclick="generateLink()">Genera Link per Tag NFC</button>
    </form>

    <div id="result">
      <hr style="margin:20px 0;">
      <p style="font-weight:600; font-size:0.9rem;">Link generato per NFC:</p>
      <input type="text" id="generated-url" readonly style="width:100%; padding:8px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">
    </div>
  </div>
</div>

<script>
  const daysKeys = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
  const dayNamesFull = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  
  const wasteList = [
    { key: 'umido', label: 'Umido' },
    { key: 'carta', label: 'Carta' },
    { key: 'plastica', label: 'Plastica' },
    { key: 'secco', label: 'Secco' },
    { key: 'vetro', label: 'Vetro' },
    { key: 'sfalci', label: 'Verde / Sfalci' },
    { key: 'pulizia_strada', label: 'Pulizia Strada' }
  ];

  function buildConfigUI() {
    const container = document.getElementById('days-config');
    container.innerHTML = '';

    daysKeys.forEach((key, idx) => {
      const row = document.createElement('div');
      row.className = 'day-row';
      const prevIdx = (idx === 0) ? 6 : idx - 1;
      
      let html = `<div class="day-title">Passaggio ${dayNamesFull[idx]}</div>`;
      html += `<div class="day-subtitle">(Da mettere fuori ${dayNamesFull[prevIdx]} sera)</div>`;
      html += `<div class="checkbox-group">`;
      wasteList.forEach(w => {
        html += `<label><input type="checkbox" name="${key}" value="${w.key}"> ${w.label}</label>`;
      });
      html += `</div>`;
      row.innerHTML = html;
      container.appendChild(row);
    });
  }

  function init() {
    buildConfigUI();
    const params = new URLSearchParams(window.location.search);
    
    // Giorno corrente (oggi)
    const todayIndex = new Date().getDay();
    
    // Giorno del passaggio del camion (domani)
    const nextDayIndex = (todayIndex + 1) % 7;
    const nextDayKey = daysKeys[nextDayIndex];

    if (params.has(nextDayKey)) {
      document.getElementById('config-mode').style.display = 'none';
      document.getElementById('view-mode').style.display = 'block';
      
      document.getElementById('day-name').innerText = 'OGGI: ' + dayNamesFull[todayIndex].toUpperCase();
      document.getElementById('target-day').innerText = 'Da esporre stasera per la raccolta di ' + dayNamesFull[nextDayIndex] + ':';
      
      const wasteContainer = document.getElementById('waste-container');
      wasteContainer.innerHTML = '';

      const rawVal = params.get(nextDayKey);
      const selectedWastes = rawVal ? rawVal.split(',') : [];

      if (selectedWastes.length === 0 || rawVal === '' || rawVal === 'nessuno') {
        wasteContainer.innerHTML = `<div class="waste-box nessuno">NESSUN RIFIUTO STASERA</div>`;
      } else {
        selectedWastes.forEach(wKey => {
          const item = wasteList.find(x => x.key === wKey);
          const labelText = item ? item.label.toUpperCase() : wKey.toUpperCase();
          const box = document.createElement('div');
          box.className = `waste-box ${wKey}`;
          box.innerText = labelText;
          wasteContainer.appendChild(box);
        });
      }
    }
  }

  function generateLink() {
    const baseUrl = window.location.href.split('?')[0];
    const params = new URLSearchParams();

    daysKeys.forEach(key => {
      const checked = Array.from(document.querySelectorAll(`input[name="${key}"]:checked`)).map(cb => cb.value);
      params.set(key, checked.length > 0 ? checked.join(',') : 'nessuno');
    });

    const finalUrl = `${baseUrl}?${params.toString()}`;
    document.getElementById('generated-url').value = finalUrl;
    document.getElementById('result').style.display = 'block';
  }

  function showConfig() {
    document.getElementById('view-mode').style.display = 'none';
    document.getElementById('config-mode').style.display = 'block';
  }

  init();
</script>
</body>
</html>
